# Shared by ALL five runs. Never edit per-run; per-method files only override method-specific keys.
seed: 6304
model_name_or_path: Qwen/Qwen3-0.6B   # or a local dir (Kaggle Model/Dataset) - fingerprint check catches mismatches
model_revision: null                   # optional: pin an HF commit hash (the resolved hash is logged in run_meta.json)
tokenizer_name_or_path: null           # null -> same as model
enable_thinking: false

train_data: data/splits/task1/train_40k.jsonl.gz
train_manifest: data/splits/task1/train_40k_manifest.json
num_train_examples: 40000
max_seq_len: 2048

micro_batch_size: 2
grad_accum: 16                         # effective batch 32
num_updates: 1250                      # 40,000 / 32
warmup_updates: 38                     # linear warmup, then cosine decay to 0
optimizer: {name: adamw, betas: [0.9, 0.999], eps: 1.0e-8, weight_decay: 0.01, fused: true}
grad_clip: 1.0
precision: fp16
loss_chunk_tokens: 1024                # memory-only knob (loss is mathematically unchanged)

recovery_at_updates: [312, 625, 937, 1250]   # 9,984 / 20,000 / 29,984 / 40,000 examples
stats_every: 125                       # displacement / adapter-eta logging cadence (updates)
save_weights_at: [1250]
keep_all_recovery: true
save_final_optimizer: false
